name: deploy-docs

when:
  - event: pull_request
  - event: push
    branch: master
  - event: tag
    ref:
      - refs/tags/v*
      - refs/tags/charts-v*

steps:
  - name: validate-docs
    image: node:22-alpine
    commands:
      - npm ci --ignore-scripts
      - npm run docs:build
      - sh -n deploy/resolve-release-image.sh
      - grep -F 'X-Agala-Revision "__VCS_REF__"' Caddyfile
      - grep -F 'USER 10001:10001' Dockerfile
      - '! grep -E "SSH_DEPLOY_KEY|ANSIBLE_PLAYBOOK|ansible-runner:latest" .woodpecker/deploy-docs.yml'

  - name: require-published-packages
    when:
      - event: tag
    image: node:22-alpine
    commands:
      - UI_VERSION=$(node -p 'require("./package.json").version')
      - CHARTS_VERSION=$(node -p 'require("./packages/charts/package.json").version')
      - npm view "@agala-labs/ui@${UI_VERSION}" version
      - npm view "@agala-labs/charts@${CHARTS_VERSION}" version

  - name: build-and-push
    when:
      - event: push
        branch: master
    image: woodpeckerci/plugin-docker-buildx
    settings:
      registry: ghcr.io
      repo: ghcr.io/agala-labs/ui-docs
      username:
        from_secret: gh_username
      password:
        from_secret: gh_token
      tags:
        - ${CI_COMMIT_SHA}
      build_args:
        - VCS_REF=${CI_COMMIT_SHA}

  - name: resolve-commit-image
    when:
      - event: push
        branch: master
    image: gcr.io/go-containerregistry/crane/debug@sha256:54b27703e6c602fbd6f95712910e9c8d45d4361a59274bde38aeec943734e424
    entrypoint:
      - /busybox/sh
      - -c
      - echo $CI_SCRIPT | base64 -d | /busybox/sh -e
    environment:
      RELEASE_IMAGE_FILE: .release/image.txt
      RELEASE_SOURCE_SHA: ${CI_COMMIT_SHA}
      REGISTRY_USERNAME:
        from_secret: gh_username
      REGISTRY_PASSWORD:
        from_secret: gh_token
    commands:
      - /busybox/sh deploy/resolve-release-image.sh

  - name: release-commit-image
    when:
      - event: push
        branch: master
    image: ghcr.io/agala-labs/ansible-runner@sha256:3534c8c327dbd5ae9dd250adce5788f176706ff1ca87de6e3797b2b8c8af019b
    environment:
      AGALA_RUNNER_MODE: k3s-release
      RELEASE_SERVICE: ui-docs
      RELEASE_IMAGE_FILE: .release/image.txt
      RELEASE_SOURCE_SHA: ${CI_COMMIT_SHA}
      RELEASE_ENVIRONMENT: production
      PLATFORM_GIT_TOKEN:
        from_secret: platform_git_release_token

# Woodpecker 3.13 rejects workflow-level concurrency. The platform publisher's
# protected force-with-lease fails closed if another release updates Git first.
