name: deploy-docs

when:
  - event: tag
    ref:
      - refs/tags/v*
      - refs/tags/charts-v*
  - event: manual

depends_on:
  - verify

steps:
  - name: require-published-packages
    when:
      - event: tag
    image: node:22-alpine
    commands:
      - npm view "@agala-labs/ui@$(node -p \"require('./package.json').version\")" version
      - npm view "@agala-labs/charts@$(node -p \"require('./packages/charts/package.json').version\")" version

  - name: build-and-push
    when:
      - event: tag
    image: woodpeckerci/plugin-docker-buildx
    settings:
      registry: ghcr.io
      repo: ghcr.io/agala-labs/ui-docs
      username:
        from_secret: gh_username
      password:
        from_secret: gh_token
      tags:
        - ${CI_COMMIT_SHA}
      build_args:
        - VCS_REF=${CI_COMMIT_SHA}

  - name: deploy
    image: ghcr.io/agala-labs/ansible-runner:latest
    pull: true
    environment:
      SSH_DEPLOY_KEY:
        from_secret: ssh_deploy_key
      GH_USER:
        from_secret: gh_username
      GH_TOKEN:
        from_secret: gh_token
      ANSIBLE_REPO: https://github.com/agala-labs/platform-iac.git
      ANSIBLE_DIR: ansible
      ANSIBLE_PLAYBOOK: ansible/playbooks/ui-docs.yml
      ANSIBLE_INVENTORY: ansible/inventories/
      ANSIBLE_USER: deploy
      ANSIBLE_LIMIT: apps
      APP_VERSION: ${CI_COMMIT_SHA}
      REGISTRY_URL: ghcr.io
      REGISTRY_USERNAME:
        from_secret: gh_username
      REGISTRY_PASSWORD:
        from_secret: gh_token
