name: deploy-docs

when:
  - event: pull_request
  - event: push
    branch: master
  - event: tag
    ref:
      - refs/tags/v*
      - refs/tags/charts-v*

steps:
  - name: validate-docs
    image: node:22-alpine
    commands:
      - npm ci --ignore-scripts
      - npm run docs:build
      - sh -n deploy/resolve-release-image.sh
      - grep -F 'X-Agala-Revision "__VCS_REF__"' Caddyfile
      - grep -F 'USER 10001:10001' Dockerfile

  - name: require-published-packages
    when:
      - event: tag
    image: node:22-alpine
    commands:
      - UI_VERSION=$(node -p 'require("./package.json").version')
      - CHARTS_VERSION=$(node -p 'require("./packages/charts/package.json").version')
      - npm view "@agala-labs/ui@${UI_VERSION}" version
      - npm view "@agala-labs/charts@${CHARTS_VERSION}" version

  - name: build-and-push
    when:
      - event: push
        branch: master
    image: woodpeckerci/plugin-docker-buildx:6.1.1
    settings:
      storage_driver: vfs
      registry: ghcr.io
      repo: ghcr.io/agala-labs/ui-docs
      username:
        from_secret: gh_username
      password:
        from_secret: gh_token
      tags:
        - ${CI_COMMIT_SHA}
      build_args:
        VCS_REF: ${CI_COMMIT_SHA}
