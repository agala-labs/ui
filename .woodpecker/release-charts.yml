name: release-charts

when:
  - event: tag
    ref: refs/tags/charts-v*

depends_on:
  - verify

steps:
  - name: publish-charts
    image: node:22-alpine
    environment:
      NPM_TOKEN:
        from_secret: npm_token
    commands:
      - test "${CI_COMMIT_TAG}" = "charts-v$(node -p \"require('./packages/charts/package.json').version\")"
      - npm ci --ignore-scripts
      - npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
      - npm view "@agala-labs/charts@$(node -p \"require('./packages/charts/package.json').version\")" version >/dev/null 2>&1 && exit 1 || true
      - npm publish --access public --workspace @agala-labs/charts

  - name: deprecate-legacy-charts
    image: node:22-alpine
    environment:
      NPM_TOKEN:
        from_secret: npm_token
    commands:
      - npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
      - npm deprecate '@el-agala/charts@*' 'Package moved to @agala-labs/charts. Install the new scope for future releases.'
