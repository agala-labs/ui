name: release-ui

when:
  - event: tag
    ref: refs/tags/v*

depends_on:
  - verify

steps:
  - name: publish-ui
    image: node:22-alpine
    environment:
      NPM_TOKEN:
        from_secret: npm_token
    commands:
      - test "${CI_COMMIT_TAG}" = "v$(node -p \"require('./package.json').version\")"
      - npm ci --ignore-scripts
      - npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
      - npm view "@agala-labs/ui@$(node -p \"require('./package.json').version\")" version >/dev/null 2>&1 && exit 1 || true
      - npm publish --access public

  - name: deprecate-legacy-ui
    image: node:22-alpine
    environment:
      NPM_TOKEN:
        from_secret: npm_token
    commands:
      - npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
      - npm deprecate '@el-agala/ui@*' 'Package moved to @agala-labs/ui. Install the new scope for future releases.'
